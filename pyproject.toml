[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baymax-companion"
version = "0.1.0"
description = "Local-first wellness companion for Reachy Mini"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
baymax-companion = "baymax_companion.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["baymax_companion"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
